name: Toolkit drift
# Weekly (and on demand): run the website checks against the public Toolkit's latest main, not the pinned toolkit.ref.
# Fails when a Toolkit release changed a sentence, label or figure the site quotes: then update the page and toolkit.ref.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Public Toolkit at its latest main
        run: npm run toolkit:fetch
        env:
          TOOLKIT_REF: main
      - name: Website checks against it
        run: npm run site:check
        env:
          TOOLKIT_DIR: vendor/toolkit
