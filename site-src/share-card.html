<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Inter;
        src: url('__FONT_URL__');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #f6f8f3;
        color: #151619;
        font-family: Inter, Arial, sans-serif;
        padding: 62px 70px;
        display: flex;
        flex-direction: column;
        position: relative;
        isolation: isolate;
      }
      /* a painted valley on the right, fading into the page colour under the text */
      body::before {
        content: '';
        position: absolute;
        z-index: -1;
        inset: 0 0 0 auto;
        width: 660px;
        background: url('__ART_URL__') 62% bottom / cover no-repeat;
        -webkit-mask: linear-gradient(90deg, transparent, #000 44%);
        mask: linear-gradient(90deg, transparent, #000 44%);
      }
      /* the print grid over the painting */
      body::after {
        content: '';
        position: absolute;
        z-index: -1;
        inset: 0 0 0 auto;
        width: 660px;
        background: url('__GRID_URL__') 0 0 / 360px 360px;
        filter: contrast(1.4);
        opacity: 0.34;
        mix-blend-mode: overlay;
        -webkit-mask: linear-gradient(90deg, transparent, #000 44%);
        mask: linear-gradient(90deg, transparent, #000 44%);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 34px;
        font-weight: 600;
      }
      .brand svg {
        width: 36px;
        height: 36px;
      }
      .title {
        font-size: 64px;
        line-height: 1.07;
        letter-spacing: -3px;
        font-weight: 500;
        margin: 62px 0 20px;
        max-width: 720px;
      }
      .sub {
        font-size: 26px;
        color: #5f6359;
        margin: 0;
        max-width: 620px;
        line-height: 1.3;
      }
      .modules {
        display: flex;
        gap: 64px;
        border-top: 1px solid #dde2d6;
        padding-top: 24px;
        margin-top: auto;
        width: 560px;
      }
      .modules strong {
        font-size: 25px;
        font-weight: 600;
      }
      .modules span {
        font-size: 22px;
        color: #5f6359;
        display: block;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 32 32"><path fill="currentColor" d="M4 5h7l5 16 5-16h7L18 28h-4z" /></svg>Vegeta
    </div>
    <div class="title">SPV &amp; syndicate<br />operations software.</div>
    <p class="sub">Reconcile payments. Calculate allocations. Prepare investor replies.</p>
    <div class="modules">
      <div><strong>Goten</strong><span>Deal Calculations</span></div>
      <div><strong>Trunks</strong><span>Operations Inbox</span></div>
    </div>
  </body>
</html>
