<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Inter;
        src: url('__FONT_URL__');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;

      .sub {
        font-size: 26px;

        font-weight: 600;

    <div class="brand">

    <div class="modules">
